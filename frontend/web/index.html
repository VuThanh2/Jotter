<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A little less to remember. A little more room to think. Jotter is a quiet home for your notes and ideas.">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jotter">
  <link rel="icon" type="image/svg+xml" href="icons/jotter.svg">
  <link rel="manifest" href="manifest.json">
  <title>Jotter — A space for your thoughts</title>
  <style>
    body { margin: 0; background: #FAF9F6; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; color: #777A72; font: 13px system-ui, sans-serif; }
    #loading img { width: 48px; height: 48px; transform: rotate(-6deg); }
  </style>
</head>
<body>
  <div id="loading" role="status"><img src="icons/jotter.svg" alt=""><span>Making room for your thoughts…</span></div>
  <noscript>Jotter needs JavaScript to open your workspace. Enable JavaScript and reload this page.</noscript>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('loading')?.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
